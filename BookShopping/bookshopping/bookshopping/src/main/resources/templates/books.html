<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
	
	<head>
		<title>Kitablar</title>
		
		<style>
			
			table,th,td{border: 1px solid black;}
				
				table{border-collapse: collapse ; width: 100%;}
				
				th{padding: 5px;background-color:tan ;}
				
				td{padding: 5px;background-color:antiquewhite ;}

                td:hover{ font-weight:bold; color:  sienna;cursor: pointer ;}
		        
		        #new-book-button{display: block; padding: 5px 10px;
		        background-color: rgb(165, 144, 139); width: 75px; text-align: center; border-radius: 10px ;text-decoration: none;}
		        #new-book-button:hover{background-color: rgb(128, 128, 64); cursor: pointer; }
		        
		        
		        
		        
		</style>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<link rel="stylesheet" type="text/css"
href="https://cdn.datatables.net/1.10.22/css/jquery.dataTables.css">

<script type="text/javascript" charset="utf8"
src="https://cdn.datatables.net/1.10.22/js/jquery.dataTables.js"></script>

<script>
$(document).ready(function() {
$('#books-table').DataTable();
});
</script>
	</head>
	
	<body>
		
		<a th:href="@{/books/new}" id="new-book-button">Yeni Kitab</a>
		
		<a th:href="@{/home}">Əsas səhifə</a>

		<table id="books-table">
			
			<thead>  <tr>  <th>ID</th> <th>Ad</th> <th>Təsvir</th> <th>Qiymət</th> <th>Müəllif</th> <th>Səhifə sayı</th> <th>Şəkil</th> </tr>  </thead>
			
			<tbody>
				
				<tr th:each="book : ${books}">
					
					<td th:text="${book.id}"></td>
					
				    <td th:text="${book.name}"></td>
				    
				    <td th:text="${book.description}"></td>
				    
				    <td th:text="${book.price}"></td>
				    
                    <td th:text="${book.author}"></td>

                    <td th:text="${book.pageCount}"></td>
                    
                    <td th:text="${book.image}"></td>


				</tr>
				
			</tbody>
			
		</table>
		
	</body>
	
</html>
