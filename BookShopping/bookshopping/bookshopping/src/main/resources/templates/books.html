<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
	
	<head>
		
		<meta charset="utf-8">
		
	    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

		<title>Kitablar</title>
		
		<style>
			
			    table,th,td{border: 1px solid black;}
				
				#books-table{border-collapse: collapse ; width: 100%;}
				
				th{padding: 5px;background-color:tan ;}
				
				td{padding: 5px;background-color:antiquewhite ;}

                td:hover{color:  sienna;cursor: pointer ;}
		        
		        #username{display: inline-block;font-size: 20px;font-weight: bold;margin:0;}    
		</style>
		
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<link rel="stylesheet" type="text/css"
href="https://cdn.datatables.net/1.10.22/css/jquery.dataTables.css">

<script type="text/javascript" charset="utf8"
src="https://cdn.datatables.net/1.10.22/js/jquery.dataTables.js"></script>

<script>
$(document).ready(function() {
$('#books-table').DataTable();});
</script>

	</head>
	
	<body>
		
		<div th:replace="menu :: menu"></div>

		<div class="container-fluid">

		<a style=" margin-top: 10px; margin-right: 10px;" class="btn btn-outline-success" th:href="@{/books/new}">Yeni Kitab</a>
		
		<a style="margin-top: 10px;" class="btn btn-outline-primary" th:href="@{/home}">Əsas səhifə</a> 
		<span id="username" th:text="${username}"></span>

        <div style="height: 10px;"></div>

		<table id="books-table">
			
		<thead>
			 
		   <tr> 
			   
			 <th>ID</th>
			 <th>Ad</th> 
			 <th>Təsvir</th> 
			 <th>Qiymət</th> 
			 <th>Müəllif</th> 
			 <th>Səhifə sayı</th> 
			 <th>Şəkil</th> 
			 <th>Əməliyyat</th> 
			 
			</tr> 
			 
		</thead>
			
		<tbody>
				
		     <tr th:each="book : ${books}">
					
					<td th:text="${book.id}"></td>
					
				    <td th:text="${book.name}"></td>
				    
				    <td th:text="${book.description}"></td>
				    
				    <td th:text="${book.price}"></td>
				    
                    <td th:text="${book.author}"></td>

                    <td th:text="${book.pageCount}"></td>
                    
                    <td th:text="${book.image}"></td>

                    <td >
						<a style="margin-right: 10px;" th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger" 
                         onclick="if(!(confirm('Kitabı silməyə əminsiniz?'))) return false">Sil</a>
                    
                        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning">Redaktə</a>
                    </td>
                     
			 </tr>
				
			</tbody>
			
		</table></div>
		
		
	</body>
	
</html>
