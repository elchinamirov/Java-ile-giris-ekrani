<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
	
	<head>
		
		<title>Yeni kitab</title>
		
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>#book-register-form{width: 300px; margin: auto}</style>

</head>
	
	<body>
		
		
		
		<h1 th:text="${yeniheader}" style="text-align: center; color: mediumseagreen;">Yeni Kitab</h1>
		
		<h2 th:text="${redakteheader}" style="text-align: center; color: rgb(128, 0, 255);">Kitab Redaktəsi</h2>





		<form th:action="@{/books/new-book-process}" method="POST" th:object="${book}" id="book-register-form">
		
		<input type="hidden" th:field="*{id}"/>
		
		<div class="form-group"><label for="book-name">Ad: </label>	
		<input class="form-control" id="book-name" th:field="*{name}"/></div>
		
		<div class="form-group"><label for="book-description">Təsvir: </label>	
		<textarea class="form-control" id="book-description" th:field="*{description}"></textarea></div>
		
		<div class="form-group"><label for="book-price">Qiymət: </label>	
		<input class="form-control" type="number" th:field="*{price}"/></div>

		<div class="form-group"><label for="book-author">Müəllif: </label>	
		<input class="form-control" id="book-author" th:field="*{author}"/></div>

		<div class="form-group"><label for="book-page-count">Səhifə sayı: </label>	
		<input class="form-control" type="book-page-count" th:field="*{pageCount}"/></div>

		<div class="form-group"><label for="book-image">Şəkil: </label>	
		<input class="form-control" type="book-image" th:field="*{image}"/></div>

			
				<input class="btn btn-success" type="submit" value="Yadda saxla" />

		</form>
				<a th:href="@{/books}">Kitabların siyahısı</a>

	</body>
	
</html>
