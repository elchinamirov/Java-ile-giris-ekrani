<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
	
	<head>
		
				
		<title>Hesaba daxil olmaq </title>
		
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

	</head>
	
	<body>
		
		<div th:replace="menu :: menu"></div>
		
		<div style="width: 300px;margin:auto;">
			
		<form th:action="@{/authenticate-user" method="POST">
			
<div th:if="${param.error}"
class="alert alert-danger alert-dismissible">
<button type="button" class="close" data-dismiss="alert">&times;</button>
Məlumatları səhv daxil etdiniz
</div>			

<div th:if="${param.logout}"
class="alert alert-success alert-dismissible">
<button type="button" class="close" data-dismiss="alert">&times;</button>
Hesabınızdan uğurla çıxdınız
</div>
			
			<div class="form-group">
			    <label for="username">İstifadəçi adı</label>
			    <input class="form-control" type="text" id="username" name="username" placeholder="İstifadəçi adı" />
		    </div>
		    
		    <div class="form-group">
			    <label for="password">Şifrə</label>
			    <input class="form-control" type="text" id="password" name="password" placeholder="Şifrə" />
		    </div>
		    
		    <button class="btn btn-success" type="submit">Giriş</button>
		
		</form>
		
        </div>
		
		

	</body>
	
</html>
